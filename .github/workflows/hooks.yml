name: hooks

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # the hooks resolve paths through $HOME/.claude, as on a real install
      - run: ln -s "$GITHUB_WORKSPACE" "$HOME/.claude"
      - run: bash --version | head -1 && jq --version
      - name: syntax
        run: for f in hooks/*.sh scripts/*.sh bootstrap.sh; do bash -n "$f" || exit 1; done
      - run: bash hooks/guard.test.sh
      - run: bash hooks/smoke.test.sh
      # CI has no Claude Code, so bootstrap must take the Homebrew path, install, and stop at the PATH check
      - name: bootstrap (macOS path)
        if: runner.os == 'macOS'
        run: |
          out=$(bash bootstrap.sh --skills none 2>&1) || true
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q '== Homebrew packages'
          printf '%s' "$out" | grep -q 'claude is not on PATH yet'
          ! printf '%s' "$out" | grep -qE 'command not found|winget'
