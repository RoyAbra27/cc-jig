name: hooks

on:
  push:
  pull_request:
  # weekly, to notice Claude Code and runner drift between pushes
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # adopters' Claude Code updates a plugin only when its version changes
      - name: a changed mod bumps its version
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'schedule'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git cat-file -e "$BASE^{commit}" 2>/dev/null || { echo "no base commit to compare against"; exit 0; }
          fail=0
          for d in mods/*/; do
            git diff --quiet "$BASE" HEAD -- "$d" && continue
            # a mod new since BASE has no old plugin.json; git show fails, and under pipefail that must not end the step
            old=$(git show "$BASE:${d}.claude-plugin/plugin.json" 2>/dev/null | jq -r .version || true)
            new=$(jq -r .version "${d}.claude-plugin/plugin.json")
            [ "$old" != "$new" ] || { echo "${d} changed but its version is still $new: bump it in ${d}.claude-plugin/plugin.json"; fail=1; }
          done
          exit "$fail"
      # fresh install: a clone in a temp HOME, as on a new machine; everything below runs from there
      - name: clone into a temp HOME
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          git clone -q "$GITHUB_WORKSPACE" "$RUNNER_TEMP/home/.claude"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - run: bash --version | head -1 && jq --version
      - name: syntax
        working-directory: ${{ runner.temp }}/home/.claude
        run: |
          for f in hooks/*.sh scripts/*.sh skills/*/scripts/*.sh bootstrap.sh update.sh; do bash -n "$f" || exit 1; done
          jq empty settings.json
          PY=$(command -v python || command -v python3)
          "$PY" -m py_compile hooks/*.py scripts/*.py skills/*/scripts/*.py && "$PY" scripts/loop-metrics.py --help
      # the plan only: no installs, no Claude Code login needed
      - name: bootstrap plan
        working-directory: ${{ runner.temp }}/home/.claude
        run: bash bootstrap.sh --dry-run --skills none
      - name: tests
        working-directory: ${{ runner.temp }}/home/.claude
        run: |
          bash hooks/smoke.test.sh
          bash hooks/guard.test.sh
          bash hooks/costly_loop.test.sh
          bash hooks/update.test.sh
          bash hooks/no-questions.test.sh
